<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Notice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
requireAdmin(); 
renderShell("Add Notice");

const container = document.getElementById("content") || document.getElementById("app");
if (container) {
    container.innerHTML = `
        <div class="card">
            <h2>Add New Notice</h2>
            <form id="noticeForm">
                <label>Notice Title</label>
                <input id="title" required>
                <label>Category</label>
                <select id="category">
                    <option>Academic</option>
                    <option>Exam</option>
                    <option>Event</option>
                    <option>General</option>
                </select>
                <label>Notice Date</label>
                <input id="date" type="date" required>
                <label>Description</label>
                <textarea id="description" rows="6" required></textarea>
                <button class="btn" type="submit">Publish Notice</button>
            </form>
        </div>
    `;
}

document.getElementById("noticeForm").addEventListener("submit", e => {
    e.preventDefault();
    addNotice({
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        date: document.getElementById("date").value,
        description: document.getElementById("description").value
    });
    alert("Notice published successfully.");
    location.href = "manage-notices.html";
});
</script>
</body>
</html>
